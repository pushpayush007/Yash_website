<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yash Sharma | Real Estate Consultant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* --- BASIC STYLES --- */
:root { --primary:#0f172a; --accent:#fbbf24; --bg:#f5f5f5; --card:#ffffff; }
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: #333; }

/* HEADER & HERO */
header { background: var(--primary); color: #fff; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
nav a { color: #fff; margin-left: 20px; text-decoration: none; }
.hero { background: linear-gradient(rgba(15,23,42,0.65),rgba(15,23,42,0.65)), url("images/hero-city.jpg") center/cover; padding: 90px 40px; }
.hero-card { background: rgba(255,255,255,0.92); border-radius: 18px; max-width: 1100px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 45px; }
.hero h2 { font-size: 2.4rem; margin: 0; }
.hero h2 span { color: var(--accent); }
.btn { display: inline-block; padding: 12px 24px; border-radius: 25px; text-decoration: none; font-weight: 600; margin-top: 10px; }
.btn-primary { background: var(--primary); color: #fff; border:none; cursor: pointer; }
.btn-accent { background: var(--accent); color: #000; }

/* PROPERTIES SECTION */
section { max-width: 1100px; margin: 60px auto; padding: 0 20px; }
.location-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
.tab-btn { padding: 10px 25px; border: 2px solid var(--primary); background: transparent; color: var(--primary); border-radius: 25px; cursor: pointer; font-weight: 600; transition: 0.3s; }
.tab-btn.active, .tab-btn:hover { background: var(--primary); color: #fff; }

.property-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.property-card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); cursor: pointer; border-left: 5px solid var(--accent); display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
.property-card:hover { transform: translateX(5px); background: var(--primary); }
.property-card h4 { margin: 0; font-size: 1rem; color: var(--primary); }
.property-card span { font-size: 0.8rem; color: #888; }
.property-card:hover h4 { color: #fff; }

/* MODAL (PDF VIEWER) */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
.modal-content { background: #fff; width: 90%; max-width: 1000px; height: 85vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.modal-header { background: var(--primary); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
.modal-close { cursor: pointer; font-size: 24px; line-height: 1; }
iframe { width: 100%; height: 100%; border: none; flex-grow: 1; }

/* FOOTER & FLOATING */
footer { background: var(--primary); color: #fff; padding: 35px; text-align: center; }
.floating { position: fixed; right: 20px; z-index: 999; }
.whatsapp { bottom: 90px; } .call { bottom: 20px; }
.floating a { width: 55px; height: 55px; background: #25d366; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 22px; text-decoration: none; }
.call a { background: var(--primary); }
</style>
</head>

<body>

<header>
  <h1>Yash Sharma</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#properties">Properties</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<div class="hero">
  <div class="hero-card">
    <img src="images/hero-city.jpg" alt="Real Estate" style="width:100%; border-radius:14px; display:none;"> <div>
      <h2>Trusted <span>Real Estate Consultant</span></h2>
      <p>Verified properties across Kota, Jaipur, Mumbai & Ajmer.</p>
      <a class="btn btn-primary" href="tel:+917597578804">Call Now</a>
    </div>
  </div>
</div>

<section id="properties">
  <h2>Prime Properties & Layouts</h2>
  <div class="location-tabs">
    <button class="tab-btn active" onclick="loadCity('Kota')">Kota</button>
    <button class="tab-btn" onclick="loadCity('Jaipur')">Jaipur</button>
    <button class="tab-btn" onclick="loadCity('Mumbai')">Mumbai</button>
    <button class="tab-btn" onclick="loadCity('Ajmer')">Ajmer</button>
  </div>

  <div class="property-grid" id="propertyList">
    </div>
</section>

<section id="contact">
  <h2>Contact Me</h2>
  <form action="https://formsubmit.co/yash2sharma2000@gmail.com" method="POST" style="background:#fff; padding:30px; border-radius:10px; max-width:600px; margin:auto;">
    <input type="text" name="name" placeholder="Name" required style="width:100%; padding:10px; margin-bottom:10px;">
    <input type="email" name="email" placeholder="Email" required style="width:100%; padding:10px; margin-bottom:10px;">
    <button class="btn btn-primary" type="submit">Send</button>
  </form>
</section>

<footer>
  <p>📞 7597578804 | Kota • Jaipur • Mumbai • Ajmer</p>
</footer>

<div class="floating whatsapp"><a href="https://wa.me/917597578804">💬</a></div>
<div class="floating call"><a href="tel:+917597578804">📞</a></div>

<div class="modal-overlay" id="layoutModal" onclick="closeModal(event)">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Layout Plan</h3>
      <div class="modal-close" onclick="closeModal(event)">×</div>
    </div>
    <iframe id="modalFrame" src=""></iframe>
  </div>
</div>

<script>
// --- CONFIGURATION BASED ON YOUR TERMINAL OUTPUT ---
// "name": What shows on the website button
// "file": The EXACT filename inside images/City_properties/{City}/

const properties = {
  "Kota": [
    { name: "Ekal Patta Main Plan", file: "EKAL PATTA Plan.pdf" },
    { name: "Plot No 2 - Ekal Patta", file: "LAYOUT PLOT NO 2-EKAL PATTA.pdf" },
    { name: "Plot No 3 - Ekal Patta", file: "LAYOUT PLOT NO 3- EKAL PATTA.pdf" },
    { name: "Plot No 4 - Ekal Patta", file: "LAYOUT PLOT NO 4- EKAL PATTA.pdf" }
  ],
  "Jaipur": [
    // Add Jaipur files here when you have them, e.g.:
    // { name: "Jagatpura Plan", file: "jagatpura.pdf" }
  ],
  "Mumbai": [],
  "Ajmer": []
};

const propList = document.getElementById("propertyList");
const tabs = document.querySelectorAll(".tab-btn");
const modal = document.getElementById("layoutModal");
const modalFrame = document.getElementById("modalFrame");
const modalTitle = document.getElementById("modalTitle");

function loadCity(city) {
  // 1. Highlight active tab
  tabs.forEach(btn => {
    btn.classList.remove("active");
    if(btn.innerText === city) btn.classList.add("active");
  });

  // 2. Clear current list
  propList.innerHTML = "";

  // 3. Check if we have data
  const cityData = properties[city];
  if (cityData && cityData.length > 0) {
    cityData.forEach(item => {
      const div = document.createElement("div");
      div.className = "property-card";
      div.innerHTML = `<h4>${item.name}</h4><span>View PDF →</span>`;
      
      div.onclick = () => {
        // Construct the path based on your folder structure:
        // images/City_properties/Kota/Filename.pdf
        const path = `images/City_properties/${city}/${item.file}`;
        openModal(path, item.name);
      };
      
      propList.appendChild(div);
    });
  } else {
    propList.innerHTML = `<p style="grid-column:1/-1; text-align:center;">No layout plans uploaded for ${city} yet.</p>`;
  }
}

function openModal(src, title) {
  modalFrame.src = src;
  modalTitle.innerText = title;
  modal.style.display = "flex";
}

function closeModal(e) {
  if(e.target === modal || e.target.classList.contains("modal-close")) {
    modal.style.display = "none";
    modalFrame.src = ""; // Stop PDF from playing/downloading in background
  }
}

// Initialize with Kota
loadCity("Kota");
</script>

</body>
</html>
